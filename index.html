<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Huohua Chinese</title>
<link rel="icon" id="favicon" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============ Huohua Chinese — "ember on ink" ============ */
/* Temperature is meaning here: cool = dormant vocabulary, warm/gold = ignited (active). */

:root{
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --bg:#F1EFE9; --surface:#FBFAF6; --surface-2:#F5F2EB; --raised:#FFFFFF;
  --line:#E4DFD4; --line-strong:#D6D0C2;
  --ink:#22212A; --ink-soft:#57555F; --ink-faint:#8E8C95;
  --spark:#E4671C; --spark-strong:#C9520F; --glow:#EDA125; --cool:#6E7A88;
  --good:#2E9E6B; --good-bg:#E6F3EC; --bad:#CE4A34; --bad-bg:#F8E9E4;
  --heat0:#7C8794; --heat1:#C98A46; --heat2:#E4671C; --heat3:#EDA125;
  --heat0-bg:#E9EAEC; --shadow:0 1px 2px rgba(30,25,15,.05), 0 8px 24px rgba(30,25,15,.06);
  --font-ui:"Manrope","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --font-hanzi:"Noto Sans SC",system-ui,sans-serif;
  --font-hanzi-display:"Noto Serif SC","Noto Sans SC",serif;
  --font-pinyin:"Noto Sans SC","Manrope",sans-serif;
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#131319; --surface:#1B1C23; --surface-2:#23242D; --raised:#242631;
    --line:#2C2E38; --line-strong:#393B47;
    --ink:#ECEAE2; --ink-soft:#A9A7AF; --ink-faint:#6E6D77;
    --spark:#F27A31; --spark-strong:#FF9147; --glow:#F4B43C; --cool:#5A6470;
    --good:#4CBB8B; --good-bg:#173026; --bad:#E0705B; --bad-bg:#361E1A;
    --heat0:#68727E; --heat1:#C2823E; --heat2:#F27A31; --heat3:#F4B43C;
    --heat0-bg:#22242C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131319; --surface:#1B1C23; --surface-2:#23242D; --raised:#242631;
  --line:#2C2E38; --line-strong:#393B47;
  --ink:#ECEAE2; --ink-soft:#A9A7AF; --ink-faint:#6E6D77;
  --spark:#F27A31; --spark-strong:#FF9147; --glow:#F4B43C; --cool:#5A6470;
  --good:#4CBB8B; --good-bg:#173026; --bad:#E0705B; --bad-bg:#361E1A;
  --heat0:#68727E; --heat1:#C2823E; --heat2:#F27A31; --heat3:#F4B43C;
  --heat0-bg:#22242C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:inherit}
html{height:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--spark); outline-offset:2px; border-radius:6px}
::selection{background:color-mix(in srgb, var(--spark) 26%, transparent)}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:246px 1fr; min-height:100dvh}
.rail{
  position:sticky; top:0; align-self:start; height:100dvh;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px 18px;
  border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; gap:6px;
}
.brand{display:flex; align-items:center; gap:11px; padding:2px 8px 18px}
.brand .mark{ width:42px;height:42px;flex:none;display:grid;place-items:center; }
.brand .mark img{ width:100%;height:100%;object-fit:contain;display:block; }
.brand .name{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-.01em; line-height:1.05}
.brand .name small{display:block; font-family:var(--font-hanzi); font-weight:500; font-size:12.5px; color:var(--ink-faint); letter-spacing:.16em}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:2px}
.nav a{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:11px;
  color:var(--ink-soft); text-decoration:none; font-weight:600; font-size:14.5px; cursor:pointer;
  transition:background .14s, color .14s;
}
.nav a .ico{width:20px; text-align:center; font-size:16px; flex:none; color:var(--ink-faint); transition:color .14s}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a.active{background:color-mix(in srgb, var(--spark) 12%, transparent); color:var(--spark-strong)}
.nav a.active .ico{color:var(--spark)}
:root[data-theme="dark"] .nav a.active, :root:not([data-theme="light"]) .nav a.active{color:var(--spark)}
.rail .spacer{flex:1}
.idcard{
  margin-top:8px; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface-2); font-size:12px; color:var(--ink-soft);
}
.idcard b{display:block; color:var(--ink); font-family:var(--font-display); letter-spacing:.02em; font-size:13.5px; margin-top:1px}
#railcard{cursor:pointer; transition:border-color .15s, background .15s}
#railcard:hover{border-color:var(--line-strong); background:var(--surface)}
#railcard #railId{display:block; margin-top:3px; font-size:11px; letter-spacing:.04em; color:var(--ink-faint)}

.profrow{display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.profrow:last-of-type{border-bottom:0}
.profrow .pname{font-weight:600; color:var(--ink)}
.profrow .phh{font-family:var(--font-display); letter-spacing:.03em}
.profrow .grow{flex:1}
.profrow .badge{font-size:11px; font-weight:700; color:var(--heat3); border:1px solid color-mix(in srgb,var(--heat3) 45%,transparent); border-radius:999px; padding:2px 9px}

.main{min-width:0; padding:34px clamp(18px,4vw,52px) 80px}
.view{display:none; animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ---------- Mobile ---------- */
.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed; inset:0 34% 0 0; z-index:60; transform:translateX(-105%);
    transition:transform .22s ease; box-shadow:var(--shadow); width:78%; max-width:300px;
  }
  .rail.open{transform:none}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55; display:none}
  .scrim.show{display:block}
  .topbar{
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    background:color-mix(in srgb,var(--bg) 86%, transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar .mmark{width:32px;height:32px;display:grid;place-items:center;}
  .topbar .mmark img{width:100%;height:100%;object-fit:contain;display:block;}
  .topbar .ttl{font-family:var(--font-display); font-weight:700; font-size:16px}
  .hamb{margin-left:auto; width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer}
  .main{padding:20px 16px 90px}
}

/* ---------- Language toggle (fixed, top-right) ---------- */
.langtoggle{
  position:fixed; z-index:70;
  top:calc(env(safe-area-inset-top,0px) + 16px); right:20px;
  display:inline-flex; gap:2px; padding:3px;
  background:color-mix(in srgb,var(--surface) 90%, transparent);
  border:1px solid var(--line); border-radius:999px;
  box-shadow:var(--shadow); backdrop-filter:blur(8px);
}
.langtoggle button{
  border:0; background:transparent; color:var(--ink-faint);
  font-weight:700; font-size:12px; letter-spacing:.04em;
  padding:6px 13px; border-radius:999px; cursor:pointer; transition:background .15s,color .15s;
}
.langtoggle button.on{ background:var(--ink); color:var(--bg); }
.langtoggle button:not(.on):hover{ color:var(--ink); }
@media (max-width:860px){
  .langtoggle{ top:calc(env(safe-area-inset-top,0px) + 13px); right:64px; }
}

/* ---------- Type ---------- */
.h-eyebrow{color:var(--ink-faint); font-weight:600; font-size:13px; margin:0 0 6px}
.h1{font-family:var(--font-display); font-weight:700; font-size:clamp(24px,3.4vw,32px); letter-spacing:-.02em; margin:0 0 4px; line-height:1.1}
.h2{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:-.01em; margin:0 0 12px}
.lede{color:var(--ink-soft); max-width:62ch; margin:0 0 22px}
.hanzi{font-family:var(--font-hanzi)}
.pinyin{font-family:var(--font-pinyin); color:var(--spark-strong); font-weight:500}
:root[data-theme="dark"] .pinyin,:root:not([data-theme="light"]) .pinyin{color:var(--spark)}

/* ---------- Cards / buttons ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
.grid{display:grid; gap:16px}
.btn{
  appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  font-weight:600; font-size:14.5px; padding:10px 16px; border-radius:11px; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px; transition:transform .06s, background .14s, border-color .14s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--spark); border-color:var(--spark); color:#fff}
.btn.primary:hover{background:var(--spark-strong); border-color:var(--spark-strong)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:9px}
.iconbtn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); cursor:pointer; display:grid; place-items:center; flex:none; transition:.14s;
}
.iconbtn:hover{color:var(--spark); border-color:var(--spark); background:color-mix(in srgb,var(--spark) 8%,transparent)}
.iconbtn.on{color:var(--spark); border-color:var(--spark)}
input[type=text],textarea,select{
  width:100%; font-family:inherit; font-size:15px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-strong); border-radius:11px; padding:11px 13px; transition:border-color .14s;
}
textarea{resize:vertical; line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--spark)}
label.field{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:0 0 6px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.hint{font-size:12.5px; color:var(--ink-faint)}
.tag{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}

/* ---------- Dashboard hero: ember field ---------- */
.hero{
  display:grid; grid-template-columns:1.15fr 1fr; gap:22px; align-items:stretch; margin-bottom:22px;
}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.emberwrap{
  background:
    radial-gradient(140% 120% at 78% 8%, color-mix(in srgb,var(--spark) 16%, transparent), transparent 60%),
    var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.emberhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px}
.bignum{font-family:var(--font-display); font-weight:700; font-size:clamp(40px,7vw,60px); line-height:.95; letter-spacing:-.03em}
.bignum .of{font-size:18px; color:var(--ink-faint); font-weight:600; letter-spacing:0}
.emberfield{
  display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; flex:1; min-height:120px;
}
.ember{width:14px;height:14px;border-radius:4px; background:var(--heat0-bg); position:relative}
.ember[data-h="0"]{background:var(--heat0); opacity:.5}
.ember[data-h="1"]{background:var(--heat1)}
.ember[data-h="2"]{background:var(--heat2)}
.ember[data-h="3"]{background:var(--heat3); box-shadow:0 0 8px color-mix(in srgb,var(--heat3) 70%,transparent)}
.igniting{animation:ignite .5s ease both}
@keyframes ignite{from{opacity:0; transform:scale(.4)}to{opacity:1; transform:none}}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:12px; color:var(--ink-soft)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px;height:11px;border-radius:3px; display:inline-block}

.sidestat{display:flex; flex-direction:column; gap:14px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.stat .k{font-size:12.5px; color:var(--ink-faint); font-weight:600}
.stat .v{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:-.02em; margin-top:2px}
.mission{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.bar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:10px}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--spark),var(--glow)); border-radius:999px; transition:width .4s}

.quick{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin:22px 0}
.qcard{
  text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .14s, transform .06s;
}
.qcard:hover{border-color:var(--spark)}
.qcard:active{transform:translateY(1px)}
.qcard .qi{font-size:22px}
.qcard h3{margin:10px 0 3px; font-size:15.5px; font-family:var(--font-display); font-weight:600}
.qcard p{margin:0; font-size:13px; color:var(--ink-soft)}

.weaklist{display:flex; flex-direction:column; gap:2px}
.weakrow{display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer}
.weakrow:last-child{border-bottom:none}
.weakrow .hz{font-family:var(--font-hanzi); font-size:19px; font-weight:500; min-width:60px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- Vocabulary ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.toolbar .search{flex:1; min-width:200px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px}
.chip{font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:.14s}
.chip:hover{border-color:var(--spark); color:var(--ink)}
.chip.on{background:var(--spark); border-color:var(--spark); color:#fff}
.wlist{display:flex; flex-direction:column; gap:0}
.wrow{border-bottom:1px solid var(--line)}
.whead{display:flex; align-items:center; gap:14px; padding:13px 6px; cursor:pointer}
.whead:hover{background:var(--surface-2)}
.wrow .hz{font-family:var(--font-hanzi); font-size:23px; font-weight:500; line-height:1; min-width:auto}
.wrow .meta{flex:1; min-width:0}
.wrow .py{font-size:13px}
.wrow .mn{font-size:13.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.heatpill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft)}
.wdetail{padding:2px 6px 18px; display:none}
.wrow.open .wdetail{display:block; animation:fade .2s}
.wexample{background:var(--surface-2); border-radius:12px; padding:13px 15px; margin:6px 0 14px; display:flex; align-items:center; gap:12px}
.wexample .ex{flex:1}
.wexample .ex .exh{font-family:var(--font-hanzi); font-size:17px; margin-bottom:2px}
.wexample .ex .exg{font-size:12.5px; color:var(--ink-faint)}
.mastery{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.mcell .ml{font-size:11.5px; color:var(--ink-faint); font-weight:600; display:flex; justify-content:space-between}
.mcell .bar{margin-top:5px}
.selfrate{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}

/* ---------- Practice shared ---------- */
.stage{max-width:720px}
.promptcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); margin-bottom:16px}
.prompt-vi{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px}
.prompt-en{color:var(--ink-soft); margin:0}
.targetwords{display:flex; gap:7px; flex-wrap:wrap; margin-top:16px}
.targetwords .tw{font-family:var(--font-hanzi); font-size:14px; font-weight:500; padding:5px 11px; border-radius:9px; background:color-mix(in srgb,var(--spark) 10%,transparent); color:var(--spark-strong); border:1px solid color-mix(in srgb,var(--spark) 25%,transparent)}
:root[data-theme="dark"] .targetwords .tw,:root:not([data-theme="light"]) .targetwords .tw{color:var(--glow)}
.answerarea .hanzi{font-size:19px; line-height:1.7}
.wordcheck{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.wordcheck .wc{display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; padding:4px 10px; border-radius:9px; border:1px solid var(--line)}
.wordcheck .wc .hanzi{font-family:var(--font-hanzi); font-size:15px; font-weight:500}
.wordcheck .wc.on{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,transparent); background:color-mix(in srgb,var(--good) 10%,transparent)}
.wordcheck .wc.off{color:var(--ink-faint); background:var(--surface-2)}
.feedback{margin-top:16px; animation:fade .25s}
.scoreline{display:flex; align-items:center; gap:16px; margin-bottom:16px}
.scorering{
  --p:0; width:74px;height:74px;border-radius:50%; flex:none; display:grid; place-items:center;
  background:conic-gradient(var(--spark) calc(var(--p)*1%), var(--surface-2) 0);
}
.scorering .inner{width:58px;height:58px;border-radius:50%; background:var(--surface); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:20px}
.dims{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px}
@media (max-width:560px){.dims{grid-template-columns:1fr}}
.dim .dl{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px}
.dim .dn{font-size:12px; color:var(--ink-faint); font-weight:500; margin-top:5px}
.answerblock{background:var(--surface-2); border-radius:12px; padding:14px 16px; margin:10px 0}
.answerblock .lbl{font-size:12px; color:var(--ink-faint); font-weight:600; margin-bottom:5px}
.answerblock .val{font-family:var(--font-hanzi); font-size:19px; display:flex; align-items:center; gap:10px}
.tips{margin:12px 0 0; padding-left:18px}
.tips li{margin-bottom:5px; color:var(--ink-soft)}
.erritem{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line); font-size:14px}
.erritem .x{color:var(--bad); text-decoration:line-through; font-family:var(--font-hanzi)}
.erritem .r{color:var(--good); font-family:var(--font-hanzi); font-weight:500}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:7px 14px;border-radius:10px}
.verdict.ok{background:var(--good-bg); color:var(--good)}
.verdict.no{background:var(--bad-bg); color:var(--bad)}
.notice{font-size:13px; color:var(--ink-soft); background:var(--surface-2); border:1px dashed var(--line-strong); padding:11px 14px; border-radius:11px; margin-bottom:14px}

/* Sentence builder */
.tiles{display:flex; flex-wrap:wrap; gap:9px; margin:6px 0 18px}
.tile{font-family:var(--font-hanzi); font-size:18px; padding:10px 15px; border-radius:11px; border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; transition:.12s; user-select:none}
.tile:hover{border-color:var(--spark)}
.tile.used{opacity:.32; pointer-events:none}
.buildzone{min-height:60px; border:1.5px dashed var(--line-strong); border-radius:14px; padding:12px; display:flex; flex-wrap:wrap; gap:9px; align-items:center; background:var(--surface-2)}
.buildzone:empty::before{content:attr(data-empty); color:var(--ink-faint); font-size:14px}
.buildzone .tile{background:var(--spark); border-color:var(--spark); color:#fff}

/* Listening */
.playbig{width:88px;height:88px;border-radius:50%; border:none; cursor:pointer; display:grid; place-items:center; font-size:32px; color:#fff;
  background:radial-gradient(120% 120% at 30% 25%, var(--glow), var(--spark) 60%, var(--spark-strong));
  box-shadow:0 8px 26px color-mix(in srgb,var(--spark) 40%, transparent); margin:4px auto 18px}
.playbig:active{transform:scale(.96)}
.diff .ok{color:var(--ink)}
.diff .miss{color:var(--bad); background:var(--bad-bg); border-radius:4px; padding:0 2px}

/* Progress */
.stack{height:16px; border-radius:8px; overflow:hidden; display:flex; margin:10px 0 8px}
.stack > i{display:block; height:100%}
.catbars{display:flex; flex-direction:column; gap:11px; margin-top:8px}
.catbar{display:grid; grid-template-columns:110px 1fr 42px; align-items:center; gap:12px; font-size:13px}
.catbar .bar{margin:0}
.week{display:flex; gap:8px; align-items:flex-end; height:96px; margin-top:12px}
.week .day{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.week .day .col{width:100%; max-width:30px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--glow),var(--spark)); min-height:3px}
.week .day .dl{font-size:11px; color:var(--ink-faint)}

.empty{text-align:center; padding:40px 20px; color:var(--ink-faint)}
.empty .big{font-size:34px; margin-bottom:8px}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:80; box-shadow:var(--shadow)}
.toast.show{opacity:1; transform:translateX(-50%)}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,currentColor 30%,transparent); border-top-color:currentColor; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px; background:var(--line); margin:22px 0}
.footnote{font-size:12px; color:var(--ink-faint); margin-top:26px}
.footnote code{background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:11.5px}
/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  padding:20px; background:color-mix(in srgb, #0b0f14 55%, transparent); backdrop-filter:blur(3px); animation:fade .16s}
.modal-card{width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.35); padding:22px 22px 18px; animation:pop .18s}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}}
.modal-title{font-family:var(--font-display); font-weight:700; font-size:18px; margin:0 0 6px; color:var(--ink)}
.modal-msg{margin:0 0 14px; line-height:1.5}
.modal-input{width:100%; box-sizing:border-box; padding:11px 13px; border:1px solid var(--line-strong); border-radius:11px;
  background:var(--surface-2); color:var(--ink); font-size:15px; font-family:inherit}
.modal-input:focus{outline:none; border-color:var(--spark)}
.modal-actions{display:flex; gap:9px; justify-content:flex-end; margin-top:18px}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 42%,transparent)}
.setbar{display:flex; align-items:center; gap:10px; margin:-4px 0 14px; flex-wrap:wrap}
.setbar .cnt{color:var(--ink-faint); font-size:13px}
.modal-wide{max-width:660px}
.maptable{overflow:auto; max-height:46vh; border:1px solid var(--line); border-radius:12px}
.maptable table{border-collapse:collapse; width:100%; font-size:13px}
.maptable th{padding:7px 8px; border-bottom:1px solid var(--line-strong); background:var(--surface-2); position:sticky; top:0; z-index:1}
.maptable td{padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; max-width:240px; overflow:hidden; text-overflow:ellipsis; color:var(--ink-soft)}
.maptable tr:last-child td{border-bottom:0}
.maptable select{width:100%; min-width:104px; padding:5px 6px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12px; font-weight:600}
.maptable td.cjk{font-family:var(--font-hanzi); color:var(--ink)}
.setpick{display:flex; align-items:center; gap:9px; margin:0 0 16px; flex-wrap:wrap}
.setpick select{padding:7px 11px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer}
</style>
</head>

/* ---------- Store (multi-profile, local-only) ----------
   Each profile is its own localStorage entry (huohua_state:<pid>) with its own
   words + progress + settings. A small index (huohua_index) tracks the list and
   which one is active. This lets several people share one device, each with a
   separate account, and move a profile to another device via a backup code. */
const LEGACY_KEY="huohua_v2";
const IDX_KEY="huohua_index";
const SPFX="huohua_state:";
function randId(len){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<len;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function newPid(){ return "p_"+Date.now().toString(36)+randId(4).toLowerCase(); }
function freshState(name){
  return {
    id:"HH-"+randId(4)+"-"+randId(4),
    code:randId(6),
    name:name||"",
    created:Date.now(),
    settings:{lang:"en", rate:0.95, theme:"system"},
    words:seedWords(),
    prog:{}, history:[], mistakes:[]
  };
}
function guardState(s){
  s.settings=Object.assign({lang:"en",rate:0.95,theme:"system"},s.settings||{});
  s.words=s.words&&s.words.length?s.words:seedWords();
  s.prog=s.prog||{}; s.history=s.history||[]; s.mistakes=s.mistakes||[];
  if(!s.id) s.id="HH-"+randId(4)+"-"+randId(4);
  if(typeof s.name!=="string") s.name="";
  if(!s.created) s.created=Date.now();
  return s;
}
function readIdx(){ try{ const r=localStorage.getItem(IDX_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function writeIdx(ix){ try{ localStorage.setItem(IDX_KEY, JSON.stringify(ix)); }catch(e){} }
function readState(pid){ try{ const r=localStorage.getItem(SPFX+pid); if(r) return guardState(JSON.parse(r)); }catch(e){} return null; }
function idxEntry(pid,s){ return {pid, name:s.name||"", hh:s.id, created:s.created||Date.now()}; }
function defaultName(){ return (navigator.language&&/vi/i.test(navigator.language)) ? "Hồ sơ 1" : "Profile 1"; }

let activePid=null, state=null, saveTimer=null;
function bootStore(){
  const ix=readIdx();
  if(ix && ix.active && readState(ix.active)){ activePid=ix.active; state=readState(activePid); return; }
  // migrate a legacy single-profile install
  try{ const raw=localStorage.getItem(LEGACY_KEY); if(raw){ const s=guardState(JSON.parse(raw));
    if(!s.name) s.name=defaultName();
    activePid=newPid(); state=s; persist(); writeIdx({active:activePid, list:[idxEntry(activePid,state)]}); return;
  }}catch(e){}
  // fresh start
  activePid=newPid(); state=freshState(defaultName());
  persist(); writeIdx({active:activePid, list:[idxEntry(activePid,state)]});
}
function persist(){ try{ localStorage.setItem(SPFX+activePid, JSON.stringify(state)); syncIdxEntry(); }catch(e){} }
function syncIdxEntry(){ const ix=readIdx()||{active:activePid,list:[]}; const e=idxEntry(activePid,state);
  const i=ix.list.findIndex(x=>x.pid===activePid); if(i>=0) ix.list[i]=e; else ix.list.push(e); ix.active=activePid; writeIdx(ix); }
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,120); }
bootStore();

function afterProfileSwitch(){ applyTheme(); syncLang(); buildNav(); refreshRail(); go("dashboard"); }
function refreshRail(){
  const nm=document.getElementById("railName"); if(nm) nm.textContent=state.name||t("untitled");
  const lb=document.getElementById("railLabel"); if(lb) lb.textContent=t("activeProfile");
  const id=document.getElementById("railId"); if(id) id.textContent=state.id;
}
function createProfile(name){ persist(); activePid=newPid(); state=freshState((name||"").trim()||t("untitled")); persist(); afterProfileSwitch(); }
function switchProfile(pid){ if(pid===activePid) return; persist(); const s=readState(pid); if(!s){ toast(t("err_generic")); return; }
  activePid=pid; state=s; const ix=readIdx()||{list:[]}; ix.active=pid; writeIdx(ix); afterProfileSwitch(); }
function renameProfile(pid,name){ name=(name||"").trim(); if(!name) return;
  if(pid===activePid){ state.name=name; persist(); }
  else { const s=readState(pid); if(s){ s.name=name; try{ localStorage.setItem(SPFX+pid, JSON.stringify(s)); }catch(e){} }
    const ix=readIdx(); if(ix){ const e=ix.list.find(x=>x.pid===pid); if(e){ e.name=name; writeIdx(ix); } } }
}
function deleteProfile(pid){ let ix=readIdx(); if(!ix) return; ix.list=ix.list.filter(x=>x.pid!==pid); try{ localStorage.removeItem(SPFX+pid); }catch(e){}
  if(pid===activePid){
    if(ix.list.length){ writeIdx(ix); switchProfile(ix.list[0].pid); return; }
    writeIdx(ix); activePid=newPid(); state=freshState(defaultName()); persist(); afterProfileSwitch(); return;
  }
  writeIdx(ix);
}
function resetProfile(){ const nm=state.name; state=freshState(nm); persist(); afterProfileSwitch(); }

/* ----- Portable backup code (unicode-safe) ----- */
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b){ return decodeURIComponent(escape(atob(b))); }
function exportCode(){ return "HUOHUA1:"+b64enc(JSON.stringify(state)); }
function importCode(text){
  text=(text||"").trim(); if(!text) return false;
  let json=text;
  if(/^HUOHUA1:/.test(text)){ try{ json=b64dec(text.slice(8)); }catch(e){ return false; } }
  let s; try{ s=JSON.parse(json); }catch(e){ return false; }
  if(!s||!s.words) return false;
  guardState(s);
  const ix=readIdx()||{list:[]}; const ent=ix.list.find(x=>x.hh===s.id);
  persist(); // save current before switching in the restored one
  if(ent){ activePid=ent.pid; } else { activePid=newPid(); if(!s.name) s.name=(s.settings.lang==="vi"?"Hồ sơ khôi phục":"Restored profile"); }
  state=s; persist(); afterProfileSwitch(); return true;
}

/* ---------- Mastery helpers ---------- */
function P(id){ return state.prog[id] || (state.prog[id]={rec:0,wri:0,use:0,lis:0,rc:0,seen:false}); }
/* Raw heat = weighted mastery. Words cool over time if untouched (forgetting curve):
   a 3-day grace, then ~3°/day, but never below 40% of peak — recognition lingers even
   when active production fades. This is what turns the ember field into a "reheat these" signal. */
var HEAT_GRACE=3, HEAT_PERDAY=3, HEAT_FLOOR=0.4;
function decayHeat(raw, last){
  if(!raw || !last) return raw;
  const days=(Date.now()-last)/86400000;
  if(days<=HEAT_GRACE) return raw;
  return Math.max(raw*HEAT_FLOOR, raw - HEAT_PERDAY*(days-HEAT_GRACE));
}
function rawHeat(p){ return 0.42*p.use+0.24*p.rec+0.2*p.lis+0.14*p.wri; }
function heatOf(id){ const p=state.prog[id]; if(!p) return 0; return Math.round(decayHeat(rawHeat(p), p.last)); }
function isCooling(id){ const p=state.prog[id]; if(!p||!p.last) return false; const raw=rawHeat(p); return raw>0 && heatOf(id) < Math.round(raw); }
function heatBucket(h){ return h>=80?3 : h>=50?2 : h>=20?1 : 0; }
function bump(id, field, amount){ const p=P(id); p[field]=Math.max(0,Math.min(100,(p[field]||0)+amount)); p.seen=true; p.last=Date.now(); }
function activeCount(){ return state.words.filter(w=>heatOf(w.id)>=50).length; }
function ignitedCount(){ return state.words.filter(w=>heatOf(w.id)>=80).length; }
function wordByHanzi(hz){ return state.words.find(w=>w.hanzi===hz); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function logPractice(ex, wordIds){
  state.history.push({d:todayStr(), ex});
  if(state.history.length>400) state.history=state.history.slice(-400);
  (wordIds||[]).forEach(id=>{ const p=P(id); p.rc=(p.rc||0)+1; });
  save();
}
function activatedToday(){
  const d=todayStr();
  // count distinct words whose usage crossed into "active" today — approximate via history reactions today
  return state.history.filter(h=>h.d===d).length;
}

let VOICES=[], zhVoice=null;
function pickVoice(){
  VOICES = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  zhVoice = VOICES.find(v=>/^zh/i.test(v.lang)) || VOICES.find(v=>/chinese|中文|普通话/i.test(v.name)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, opts){
  opts=opts||{};
  if(!window.speechSynthesis){ toast("Speech not supported on this device"); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN";
    if(zhVoice) u.voice=zhVoice;
    u.rate = opts.slow ? Math.max(0.5, state.settings.rate*0.6) : state.settings.rate;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hasZh(){ return !!zhVoice; }

/* ---------- utils ---------- */
const $=(s,r)=>(r||document).querySelector(s);
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stripCn(s){ return String(s||"").replace(/[\s，。！？、；：“”‘’（）【】…—.,!?;:'"()\[\]]/g,""); }
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1900); }
/* ---------- Modal dialogs ---------- */
function buildModal(opts, resolve){
  const withInput = opts.input!==false;
  const ov=el("div","modal-overlay");
  const card=el("div","modal-card"); card.setAttribute("role","dialog"); card.setAttribute("aria-modal","true");
  card.innerHTML=
    '<h2 class="modal-title"></h2>'+
    (opts.message?'<p class="modal-msg hint"></p>':'')+
    (withInput?'<input type="text" class="modal-input">':'')+
    '<div class="modal-actions">'+
      '<button class="btn ghost" data-x></button>'+
      '<button class="btn '+(opts.danger?"danger":"primary")+'" data-ok></button>'+
    '</div>';
  card.querySelector(".modal-title").textContent=opts.title||"";
  if(opts.message) card.querySelector(".modal-msg").textContent=opts.message;
  card.querySelector("[data-x]").textContent=opts.cancelText||t("cancel");
  card.querySelector("[data-ok]").textContent=opts.confirmText||t("ok");
  ov.appendChild(card);
  const inp=card.querySelector(".modal-input"); if(inp){ inp.placeholder=opts.placeholder||""; inp.value=opts.value||""; }
  let done=false;
  function close(val){ if(done) return; done=true; document.removeEventListener("keydown",onkey); ov.remove(); resolve(val); }
  function onkey(e){ if(e.key==="Escape"){ e.preventDefault(); close(withInput?null:false); }
    else if(e.key==="Enter"){ e.preventDefault(); close(withInput?(inp?inp.value:""):true); } }
  card.querySelector("[data-x]").onclick=()=>close(withInput?null:false);
  card.querySelector("[data-ok]").onclick=()=>close(withInput?(inp?inp.value:""):true);
  ov.addEventListener("mousedown",e=>{ if(e.target===ov) close(withInput?null:false); });
  document.addEventListener("keydown",onkey);
  document.body.appendChild(ov);
  setTimeout(()=>{ if(inp){ inp.focus(); inp.select(); } else card.querySelector("[data-ok]").focus(); },30);
}
function modalPrompt(opts){ return new Promise(res=>buildModal(Object.assign({input:true},opts),res)); }
function modalConfirm(opts){ return new Promise(res=>buildModal(Object.assign({input:false},opts),res)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function meaningOf(w){ return state.settings.lang==="vi" ? (w.vi||w.en) : (w.en||w.vi); }

    '</div>'+
    '<div id="vpanel"></div>'+
    '<div class="chips" id="vchips"></div>'+
    '<div class="wlist" id="wlist"></div>';

  // chips
  const chips=$("#vchips",v);
  const mk=(id,label)=>{ const c=el("button","chip"+(vocabFilter.cat===id?" on":"")); c.textContent=label; c.onclick=()=>{vocabFilter.cat=id; renderVocab($("#view-vocab"));}; return c; };

  // custom cats
  const extra=[...new Set(state.words.map(w=>w.cat))].filter(c=>!CATS.includes(c));
  extra.forEach(c=>chips.appendChild(mk(c,c)));
  // delete-set action when a single category is selected
  if(vocabFilter.cat!=="all"){
    const inCat=state.words.filter(w=>w.cat===vocabFilter.cat).length;

      ren.onclick=async()=>{
        const newName=await modalPrompt({title:t("renameSet"), message:t("renameSetMsg",{set:label}), placeholder:label, value:label, confirmText:t("save")});
        if(newName!==null && newName.trim() && newName.trim()!==vocabFilter.cat){
          renameCategory(vocabFilter.cat, newName.trim());
          toast(t("saved"));
        }
      };
      bar.appendChild(ren);
      const del=el("button","btn sm danger"); del.textContent="🗑 "+t("deleteSet");
      del.onclick=async()=>{
        const ok=await modalConfirm({title:t("deleteSet"), message:t("deleteSetConfirm",{set:label,n:inCat}), confirmText:t("delete"), danger:true});

  const search=$("#vsearch",v);
  search.oninput=()=>{ vocabFilter.q=search.value; drawList(); };
  $("#vadd",v).onclick=()=>toggleAddForm();
  $("#vimport",v).onclick=()=>toggleImportForm();
  drawList();

    const list=$("#wlist"); list.innerHTML="";

    const rows=state.words.filter(w=>{
      if(vocabFilter.cat!=="all" && w.cat!==vocabFilter.cat) return false;
      if(!q) return true;

    '<span class="hz hanzi">'+esc(w.hanzi)+'</span>'+

    '<span class="tag">'+esc(CAT_LABEL[w.cat]||w.cat)+'</span>';
  const playB=el("button","iconbtn","▶"); playB.title=t("play");
  playB.onclick=(e)=>{ e.stopPropagation(); speak(w.hanzi); bump(w.id,"rec",3); save(); };
  head.appendChild(playB);
  head.onclick=()=>{ row.classList.toggle("open"); if(row.classList.contains("open")) fillDetail(); };
  row.appendChild(head);
  const det=el("div","wdetail"); row.appendChild(det);
  let filled=false;
  function fillDetail(){
    if(filled) return; filled=true;
    const p=P(w.id);
    det.innerHTML=
      (w.ex?('<div class="wexample"><div class="ex"><div class="exh hanzi">'+esc(w.ex)+'</div><div class="exg">'+esc(w.exen||"")+'</div></div>'+
        '<button class="iconbtn" title="'+esc(t("play"))+'" data-p="1">▶</button><button class="iconbtn" title="'+esc(t("slow"))+'" data-p="2">🐢</button>'+(aiConfigured()?'<button class="iconbtn" title="'+esc(t("regenOne"))+'" data-regen="1">🔄</button>':'')+'</div>'):'')+
      '<div class="mastery">'+
        mcell(t("recognition"),p.rec)+mcell(t("writing"),p.wri)+mcell(t("usage"),p.use)+mcell(t("listening"),p.lis)+
      '</div>'+
      '<div class="selfrate">'+
        '<button class="btn sm" data-r="no">'+esc(t("markNo"))+'</button>'+
        '<button class="btn sm" data-r="meh">'+esc(t("markMeh"))+'</button>'+
        '<button class="btn sm primary" data-r="know">'+esc(t("markKnow"))+'</button>'+
      '</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn sm ghost danger" data-del>🗑 '+esc(t("deleteWord"))+'</button></div>';
    det.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>speak(w.ex,{slow:b.dataset.p==="2"}));
    const rg=det.querySelector("[data-regen]");
    if(rg) rg.onclick=async()=>{ rg.textContent="…"; try{ await genOneExample(w); filled=false; fillDetail(); }catch(e){ toast((e&&e.code)==="rate_limited"?t("aiRate"):t("aiFail")); rg.textContent="🔄"; } };
    det.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      const r=b.dataset.r;
      if(r==="know"){ bump(w.id,"rec",25); bump(w.id,"use",12); }
      else if(r==="meh"){ bump(w.id,"rec",10); }
      else { bump(w.id,"rec",3); }
      P(w.id).seen=true; logPractice("review",[w.id]); toast(t("saved"));
      // re-render row heat
      const nb=heatBucket(heatOf(w.id));
      head.querySelector(".heatpill").innerHTML='<span class="dot" style="background:var(--heat'+nb+')"></span>'+heatOf(w.id)+'°';
      filled=false; det.innerHTML=""; fillDetail();
    });
    const db=det.querySelector("[data-del]");
    if(db) db.onclick=async()=>{
      const ok=await modalConfirm({title:t("deleteWord"), message:t("deleteWordConfirm",{w:w.hanzi}), confirmText:t("delete"), danger:true});
      if(ok){ deleteWord(w.id); toast(t("deleted")); }
    };
  }
  return row;
}

  $("#csvfile").onchange=(e)=>{ const f=e.target.files[0]; if(!f) return;
    const isXlsx=/\.x(lsx|ls|lsm)$/i.test(f.name);

    if(isXlsx){
      if(!window.XLSX){ toast(t("err_generic")); e.target.value=""; return; }
      const rd=new FileReader();
      rd.onload=()=>{ try{
        const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""});
        openImportMapper(rows.map(r=>(r||[]).map(c=>String(c==null?"":c))), def);
      }catch(err){ toast(t("err_generic")); } e.target.value=""; };
      rd.readAsArrayBuffer(f);
    } else {
      const rd=new FileReader();
      rd.onload=()=>{ openImportMapper(parseDelimited(rd.result), def); e.target.value=""; }; rd.readAsText(f);
    }
  };
  $("#csvimport").onclick=()=>{
    const txt=$("#csvtext").value; if(!txt.trim()){ $("#csvtext").focus(); return; }
    openImportMapper(parseDelimited(txt), "");
  };
  $("#csvcancel").onclick=()=>{ panel.innerHTML=""; panel.dataset.mode=""; };
}
function importCsv(text, forcedCat){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return 0;
  const delim = lines[0].includes("\t") ? "\t" : ",";
  return importRows(lines.map(l=>splitCsv(l,delim)), forcedCat);
}

/* Shared importer: takes rows of already-split cells (from CSV, TSV, or a spreadsheet). */
function importRows(rows, forcedCat, noHeader){
  rows=(rows||[]).map(r=>(r||[]).map(c=>String(c==null?"":c).trim())).filter(r=>r.some(c=>c));
  if(!rows.length) return 0;
  let start=0;

  const fc=(forcedCat||"").trim();

    const c=rows[i];
    if(!c[0]) continue;
    state.words.push({id:"u"+Date.now()+"_"+i, hanzi:c[0]||"", pinyin:c[1]||"", vi:c[2]||"", en:c[3]||"",
      cat: fc || (c[4]||t("impDefault")), ex:c[5]||"", exen:c[6]||""});

}
function detectDelim(text){
  const line=(String(text||"").split(/\r?\n/).find(l=>l.trim()))||"";
  const c={";":0,",":0,"\t":0}; let q=false;
  for(const ch of line){ if(ch==='"') q=!q; else if(!q && (ch===";"||ch===","||ch==="\t")) c[ch]++; }
  let best=",",n=0; for(const d in c){ if(c[d]>n){ n=c[d]; best=d; } }
  return best;
}
function parseDelimited(text){
  const delim=detectDelim(text);
  const lines=String(text||"").replace(/^\ufeff/,"").split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(l=>splitCsv(l,delim));
}
function guessFromHeader(name){
  name=(name||"").toLowerCase();
  if(/hanzi|汉字|漢字|中文|chữ hán/.test(name)) return "hanzi";
  if(/pinyin|拼音/.test(name)) return "pinyin";
  if(/meaning_en|english|_en|\ben\b|nghĩa.*(en|anh)/.test(name)) return "en";
  if(/meaning|nghĩa|意思|定义|_vi/.test(name)) return "vi";
  if(/example|ví dụ|例/.test(name)) return "ex";
  if(/category|phân loại|loại|hsk|set|hán/.test(name)) return "ignore";
  return null;
}
function guessRoles(cells2d, hasHeader, ncol){
  const roles=new Array(ncol).fill("ignore");
  const dataRows=hasHeader?cells2d.slice(1):cells2d;
  if(hasHeader){ for(let ci=0;ci<ncol;ci++){ const r=guessFromHeader(cells2d[0][ci]||""); if(r) roles[ci]=r; } }
  const cjk=/[\u3400-\u9fff]/, tone=/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
  const stats=[];
  for(let ci=0;ci<ncol;ci++){
    const samp=dataRows.slice(0,12).map(r=>(r[ci]||"")).filter(x=>x.trim());
    let cjkN=0,toneN=0,len=0;
    samp.forEach(s=>{ if(cjk.test(s))cjkN++; if(tone.test(s))toneN++; len+=s.length; });
    stats[ci]={cjk:samp.length?cjkN/samp.length:0, tone:samp.length?toneN/samp.length:0, avg:samp.length?len/samp.length:0};
  }
  if(roles.indexOf("hanzi")<0){ let best=-1,bv=0.5; for(let ci=0;ci<ncol;ci++){ if(stats[ci].cjk>bv){ bv=stats[ci].cjk; best=ci; } } if(best>=0) roles[best]="hanzi"; }
  if(roles.indexOf("pinyin")<0){ for(let ci=0;ci<ncol;ci++){ if(roles[ci]==="ignore" && stats[ci].tone>0.3){ roles[ci]="pinyin"; break; } } }
  if(roles.indexOf("vi")<0){ let best=-1,bl=1; for(let ci=0;ci<ncol;ci++){ if(roles[ci]==="ignore" && stats[ci].cjk<0.3 && stats[ci].avg>bl){ bl=stats[ci].avg; best=ci; } } if(best>=0) roles[best]="vi"; }
  return roles;
}

function splitCsv(line,delim){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===delim && !q){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out.map(s=>s.trim());
}

/* ----- Local grading: compare the learner's Chinese to the sample answer ----- */
function lcsAlign(a, b){
  const n=a.length, m=b.length;
  const dp=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--){
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  }
  const bMark=new Array(m).fill(false);
  let i=0,j=0,matched=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ bMark[j]=true; matched++; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++;
    else j++;
  }
  return {matched, bMark};
}
function gradeReactLocal(userRaw, p){
  const A=stripCn(userRaw).split(""), B=stripCn(p.ref).split("");
  const {matched, bMark}=lcsAlign(A, B);
  const sim = B.length ? Math.round(matched/B.length*100) : 0;
  const exact = A.join("")===B.join("");
  const used=(p.words||[]).filter(w=>userRaw.includes(w));
  let refDiff=""; B.forEach((ch,idx)=>{ refDiff += bMark[idx] ? '<span class="ok">'+esc(ch)+'</span>' : '<span class="miss">'+esc(ch)+'</span>'; });
  return {sim, exact, used, refDiff};
}

function aiCfg(){ try{ return JSON.parse(localStorage.getItem("huohua_ai"))||{}; }catch(e){ return {}; } }

function aiConfigured(){ const c=aiCfg(); return !!(c.key && c.key.trim()); }
const AI_DEFAULT_MODEL="openai/gpt-oss-120b";
async function aiChat(messages, opts){
  opts=opts||{};
  const c=aiCfg(); if(!c.key||!c.key.trim()) throw {code:"no_key"};
  const body={ model:(c.model&&c.model.trim())||AI_DEFAULT_MODEL, messages:messages,
    temperature:(opts.temperature!=null?opts.temperature:0.3) };
  if(opts.json) body.response_format={type:"json_object"};
  let res;
  try{ res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST", headers:{ "Authorization":"Bearer "+c.key.trim(), "Content-Type":"application/json" },
    body:JSON.stringify(body) }); }
  catch(e){ console.error("Huohua AI network error:", e); throw {code:"network", message:String((e&&e.message)||e)}; }
  if(!res.ok){
    let detail=""; try{ const j=await res.json(); detail=(j&&j.error&&(j.error.message||j.error))||""; }catch(e){ try{ detail=await res.text(); }catch(e2){} }
    console.error("Huohua AI error", res.status, detail);
    let code="http_"+res.status; if(res.status===401||res.status===403) code="bad_key"; else if(res.status===429) code="rate_limited";
    throw {code:code, status:res.status, message:(typeof detail==="string"?detail:JSON.stringify(detail))};
  }
  const data=await res.json();
  const text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||"";
  if(opts.json){ try{ return JSON.parse(text); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e2){} } throw {code:"bad_json"}; } }
  return text;
}
async function genExamples(setCat, mode){
  const has=w=>w.ex&&w.ex.trim();
  const pool=state.words.filter(w=>w.cat===setCat && (mode==="refresh"?has(w):!has(w)));
  if(!pool.length) return 0;
  const cap=pool.slice(0,24), CH=8; let done=0;
  const vary = mode==="refresh" ? " Make each sentence clearly different from a typical textbook example and vary the situation." : "";
  for(let i=0;i<cap.length;i+=CH){
    const chunk=cap.slice(i,i+CH);
    const list=chunk.map((w,k)=>(k+1)+". "+w.hanzi+(w.pinyin?" ("+w.pinyin+")":"")).join("\n");
    const sys="You are a Mandarin Chinese teacher. Reply ONLY with a compact JSON object, no markdown.";
    const usr="For each Chinese word below, write ONE natural sentence that uses the exact word."+diffClause()+vary+" Return {\"items\":[...]} with one item per word, in the same order. Each item: {\"cn\":\"<sentence>\",\"tiles\":[\"<chunk>\",...],\"vi\":\"<Vietnamese translation>\",\"en\":\"<English translation>\"}. IMPORTANT: \"vi\" MUST be in Vietnamese, \"en\" MUST be in English. Both are required and must not be empty. \"tiles\" must be the sentence split into 3-7 natural word chunks that, joined in order, exactly equal cn.\nWords:\n"+list;
    const data=await aiChat([{role:"system",content:sys},{role:"user",content:usr}],{json:true,temperature:(mode==="refresh"?0.85:0.4)});
    const items=(data&&data.items)||[];
    chunk.forEach((w,k)=>{ const it=items[k]; if(it&&it.cn){
      w.ex=String(it.cn).trim();
      w.exvi=String(it.vi||"").trim(); w.exen=String(it.en||"").trim();
      let tiles=Array.isArray(it.tiles)?it.tiles.map(x=>String(x)):[];
      if(tiles.join("").replace(/\s/g,"")!==w.ex.replace(/\s/g,"")) tiles=Array.from(w.ex);
      w.extiles=tiles; w.exUses=0; w.exLevel=difficultyLevel(); done++;
    }});
    save();
  }
  return done;
}
const genFailed=new Map(); // id -> retry count
const MAX_GEN_RETRY=2;
function autoRefreshN(){ const n=state.settings.autoRefresh; return n==null?5:(parseInt(n,10)||0); }
function difficultyLevel(){ return state.settings.difficulty||"easy"; }
function diffClause(){ const d=difficultyLevel();
  if(d==="hard") return " Make it a longer, richer sentence (about 20-35 Chinese characters) using a subordinate clause or a connective such as 因为/所以, 虽然/但是, 如果/就, or 不但/而且; keep it natural and correct.";
  if(d==="medium") return " Make it a natural everyday sentence of moderate length (about 12-20 Chinese characters); you may use one common connective.";
  return " Keep it short and beginner-friendly (about 6-12 Chinese characters) with simple grammar."; }
function needsGen(w){ if(!w) return false; if(!(w.ex&&w.ex.trim())) return true; if((w.exLevel||"easy")!==difficultyLevel()) return true; const n=autoRefreshN(); if(n>0 && (w.exUses||0)>=n) return true; return false; }
function noteTested(w){ if(!w) return; w.exUses=(w.exUses||0)+1; save(); }
async function genOneExample(w){
  const sys="You are a Mandarin Chinese teacher. Reply ONLY with a compact JSON object, no markdown.";
  const usr="Write ONE natural Chinese sentence that uses the word \""+w.hanzi+"\""+(w.pinyin?" (pinyin: "+w.pinyin+")":"")+"."+diffClause()+" Return {\"cn\":\"<sentence>\",\"tiles\":[\"<chunk>\",...],\"vi\":\"<Vietnamese translation>\",\"en\":\"<English translation>\"}. \"tiles\" = the sentence split into 3-7 natural word chunks that, joined in order, exactly equal cn. IMPORTANT: \"vi\" MUST be in Vietnamese, \"en\" MUST be in English. Both are required and must not be empty.";
  const it=await aiChat([{role:"system",content:sys},{role:"user",content:usr}],{json:true,temperature:0.5});
  if(it&&it.cn){
    w.ex=String(it.cn).trim(); w.exvi=String(it.vi||"").trim(); w.exen=String(it.en||"").trim();
    let tiles=Array.isArray(it.tiles)?it.tiles.map(x=>String(x)):[];
    if(tiles.join("").replace(/\s/g,"")!==w.ex.replace(/\s/g,"")) tiles=Array.from(w.ex);
    w.extiles=tiles; w.exUses=0; w.exLevel=difficultyLevel(); save(); return true;
  }
  throw {code:"bad_json"};
}

  const themeBtn=(id,label)=>'<button class="btn sm '+(state.settings.theme===id?"primary":"")+'" data-theme="'+id+'">'+esc(label)+'</button>';
  v.innerHTML=
    '<p class="h-eyebrow">'+esc(t("nav_settings"))+'</p>'+
    '<h1 class="h1">'+esc(t("settings_h"))+'</h1>'+
    '<div class="card" style="margin-bottom:16px"><h2 class="h2">'+esc(t("uiLang"))+'</h2>'+
      '<div class="row">'+langBtn("en","English")+langBtn("vi","Tiếng Việt")+'</div></div>'+
    '<div class="card" style="margin-bottom:16px"><h2 class="h2">'+esc(t("theme"))+'</h2>'+
      '<div class="row">'+themeBtn("system",t("theme_system"))+themeBtn("light",t("theme_light"))+themeBtn("dark",t("theme_dark"))+'</div></div>'+
    '<div class="card" style="margin-bottom:16px"><h2 class="h2">'+esc(t("voice"))+'</h2>'+
      '<label class="field">'+esc(t("voiceRate"))+'</label>'+
      '<div class="row">'+rateBtn(0.6,t("speed_slow"))+rateBtn(0.95,t("speed_normal"))+rateBtn(1.2,t("speed_fast"))+'</div>'+
      '<p class="hint" style="margin-top:12px">'+esc(t("voiceStatus"))+': '+(hasZh()?('<span style="color:var(--good)">✓ '+esc(zhVoice?zhVoice.name:"zh")+'</span>'):('<span style="color:var(--bad)">✕</span> '+esc(state.settings.lang==="vi"?"Không tìm thấy giọng tiếng Trung trên thiết bị này.":"No Chinese voice found on this device."))) +
        ' <button class="btn sm" id="vtest" style="margin-left:8px">你好，我们开始吧 ▶</button></p></div>'+
    '<div class="card" style="margin-bottom:16px"><h2 class="h2">'+esc(t("aiTitle"))+'</h2>'+'<p class="hint" style="margin-top:0">'+esc(t("aiHelp"))+'</p>'+'<label class="field">'+esc(t("aiKey"))+'</label>'+'<input type="password" id="aikey" autocomplete="off" placeholder="gsk_..." value="'+esc(aiCfg().key||"")+'" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px">'+'<label class="field" style="margin-top:10px">'+esc(t("aiModel"))+'</label>'+'<input type="text" id="aimodel" autocomplete="off" placeholder="'+esc(AI_DEFAULT_MODEL)+'" value="'+esc(aiCfg().model||"")+'" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px">'+'<label class="field" style="margin-top:10px">'+esc(t("autoRefLabel"))+'</label>'+'<input type="number" id="autoref" min="0" max="50" value="'+esc(String(autoRefreshN()))+'" style="width:130px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px">'+'<p class="hint" style="margin:6px 0 0">'+esc(t("autoRefHint"))+'</p>'+'<div class="row" style="margin-top:12px"><button class="btn primary" id="aitest">'+esc(t("aiTest"))+'</button>'+'<button class="btn ghost" id="aiclear">'+esc(t("aiClear"))+'</button>'+'<a class="btn ghost" href="https://console.groq.com/keys" target="_blank" rel="noopener">'+esc(t("aiGetKey"))+'</a></div>'+'<div class="hint" id="aistatus" style="margin-top:10px">'+(aiConfigured()?'<span style="color:var(--good)">\u2713 '+esc(t("aiActive"))+'</span>':esc(t("aiOffNote")))+'</div></div>'+'<div class="card" style="margin-bottom:16px"><h2 class="h2">'+esc(t("profiles"))+'</h2>'+
      '<div id="proflist"></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn" id="newprof">＋ '+esc(t("newProfile"))+'</button></div>'+
      '<p class="hint" style="margin-top:10px">'+esc(t("profilesHelp"))+'</p></div>'+
    '<div class="card"><h2 class="h2">'+esc(t("backup"))+'</h2>'+
      '<p class="hint" style="margin-top:0">'+esc(t("backupHelp"))+'</p>'+
      '<div class="row"><button class="btn" id="copydata">⧉ '+esc(t("copyCode"))+'</button>'+
        '<button class="btn" id="pastebtn">'+esc(t("importBtn"))+'</button>'+
        '<button class="btn" id="resetbtn" style="margin-left:auto;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)">'+esc(t("reset"))+'</button></div>'+
      '<textarea id="databox" rows="3" style="margin-top:12px;font-family:monospace;font-size:12px" placeholder="'+esc(t("importPlaceholder"))+'"></textarea></div>'+
    '<p class="footnote">Huohua Chinese · Phase 1 MVP · '+esc(state.settings.lang==="vi"?"Phản hồi AI dùng tài khoản Claude của bạn.":"AI feedback runs on your own Claude account.")+'</p>';

  v.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  v.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{ state.settings.rate=parseFloat(b.dataset.rate); save(); speak("你好"); renderSettings($("#view-settings")); });
  v.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ state.settings.theme=b.dataset.theme; save(); applyTheme(); renderSettings($("#view-settings")); });
  $("#vtest",v).onclick=()=>speak("你好，我们开始吧");
  (function(){
    const ak=$("#aikey",v), am=$("#aimodel",v), ast=$("#aistatus",v);
    function saveAi(){ const c=aiCfg(); c.key=ak.value.trim(); c.model=am.value.trim(); aiSave(c); }
    if(ak) ak.oninput=saveAi;
    if(am) am.oninput=saveAi;
    const ar=$("#autoref",v); if(ar) ar.onchange=()=>{ state.settings.autoRefresh=Math.max(0,Math.min(50,parseInt(ar.value,10)||0)); save(); };
    const cl=$("#aiclear",v); if(cl) cl.onclick=()=>{ aiSave({}); renderSettings($("#view-settings")); };
    const tb=$("#aitest",v); if(tb) tb.onclick=async()=>{
      saveAi();
      if(!aiConfigured()){ ast.textContent=t("aiNoKey"); return; }
      ast.textContent=t("aiTesting"); tb.disabled=true;
      try{ await aiChat([{role:"user",content:"Reply with just: ok"}],{temperature:0}); ast.innerHTML='<span style="color:var(--good)">\u2713 '+esc(t("aiOk"))+'</span>'; }
      catch(err){ const code=err&&err.code;
        let msg = code==="bad_key"?t("aiBadKey") : code==="rate_limited"?t("aiRate")
          : t("aiFail")+(err&&err.message?(" — "+err.message):(err&&err.status?(" ("+err.status+")"):""));
        ast.innerHTML='<span style="color:var(--bad)">'+esc(msg)+'</span>'; }
      finally{ tb.disabled=false; }
    };
  })();

  // profile list
  const pl=$("#proflist",v); const profs=listProfiles(); const many=profs.length>1;
  profs.forEach(p=>{
    const active=p.pid===activePid;
    const row=el("div","profrow");
    row.innerHTML='<span class="dot" style="width:9px;height:9px;border-radius:50%;background:'+(active?"var(--heat3)":"var(--line-strong)")+'"></span>'+
      '<span class="pname"></span><span class="phh hint"></span><span class="grow"></span>'+
      (active?'<span class="badge">'+esc(t("current"))+'</span>':'<button class="btn sm" data-sw>'+esc(t("switchTo"))+'</button>')+
      '<button class="btn sm ghost" data-rn>'+esc(t("rename"))+'</button>'+
      (many?'<button class="btn sm ghost" data-del style="color:var(--bad)">'+esc(t("delete"))+'</button>':'');
    row.querySelector(".pname").textContent=p.name||t("untitled");
    row.querySelector(".phh").textContent=p.hh;
    const sw=row.querySelector("[data-sw]"); if(sw) sw.onclick=()=>switchProfile(p.pid);
    row.querySelector("[data-rn]").onclick=()=>{ const n=prompt(t("profileNamePrompt"), p.name||""); if(n&&n.trim()){ renameProfile(p.pid,n); refreshRail(); renderSettings($("#view-settings")); } };
    const del=row.querySelector("[data-del]"); if(del) del.onclick=()=>{ if(confirm(t("confirmDeleteProfile"))){ const wasActive=p.pid===activePid; deleteProfile(p.pid); if(!wasActive) renderSettings($("#view-settings")); } };
    pl.appendChild(row);
  });
  $("#newprof",v).onclick=()=>{ const n=prompt(t("profileNamePrompt"),""); if(n!==null) createProfile(n); };

  // backup code
  $("#copydata",v).onclick=async()=>{
    const data=exportCode();
    $("#databox",v).value=data;
    try{ await navigator.clipboard.writeText(data); toast(t("copied")); }
    catch(e){ $("#databox",v).select(); toast(t("copied")); }
  };
  $("#pastebtn",v).onclick=()=>{
    const raw=$("#databox",v).value.trim(); if(!raw){ $("#databox",v).focus(); return; }
    if(importCode(raw)) toast(t("restored")); else toast(t("err_generic"));
  };
  $("#resetbtn",v).onclick=()=>{ if(confirm(t("confirmReset"))){ resetProfile(); toast(t("didReset")); } };
}
